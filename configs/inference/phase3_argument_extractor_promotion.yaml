  - run_train_data_matches_file
  - run_eval_manifest_matches_file
  - run_eval_data_matches_file
  - foundation_model_sha_exists
  - tokenizer_sha_exists
  - task_spec_sha_exists
  - training_code_commit_exists
  - optimizer_steps_positive
  - finite_run_metrics
  - finite_promotion_metrics
  - best_checkpoint_promoted
  - d1_phase2_phase3_view_consistency
  - heldout_width_k1_present
  - heldout_width_k2_present
  - heldout_width_k3_present
  - argument_class_read_only_empty_present
  - argument_class_patch_scalar_present
  - argument_class_patch_nested_present
  - argument_class_post_no_arguments_present
  - argument_class_post_one_argument_present
  - argument_class_post_multiple_arguments_present
  - argument_class_delete_no_body_present
  - http_method_get_present
  - http_method_head_present
