schema_version: phase3_argument_extractor_promotion.v1
phase: 3
source_dataset: D1
task: text_and_rest_api_list_to_calls
target_semantics: unordered_unique_call_set
thresholds:
  min_json_parse_rate: 0.995
  min_call_set_exact_match_rate: 0.90
  min_rest_api_coverage_exact: 0.99
  min_method_exact_match_rate: 0.98
  min_operation_name_exact_match_rate: 0.98
  min_argument_schema_valid_rate: 0.995
  min_argument_value_grounding_rate: 0.99
  min_arguments_exact_match_rate: 0.90
  min_readonly_empty_arguments_rate: 1.0
  max_invalid_method_rate: 0.0
  max_duplicate_call_rate: 0.0
  max_missing_call_rate: 0.01
  max_extra_call_rate: 0.01
hard_checks:
  - immutable_full_manifest
  - full_manifest_sha_matches_file
  - immutable_train_manifest
  - disjoint_train_heldout_release
  - real_promoted_parent_checkpoint
