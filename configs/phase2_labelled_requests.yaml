dataset:
  name: D1
  prompt_spec_version: phase2-labelled-requests-v1

sampling:
  sample_widths:
    - 1
    - 2
    - 3
  context_distractors: 4
  empty_set_candidates: 1000
  max_accepted_rows: 100000
  max_candidates: 300000
  max_accepted_per_combination: 8
  max_attempts_per_combination: 24
  max_accepted_per_api: 200

model_x:
  model_id: ${PHASE1_MODEL_X_MODEL_ID}
  artifact_sha: ${PHASE1_MODEL_X_ARTIFACT_SHA}

judge:
  route: ${PHASE2_JUDGE_ROUTE}
  model_id: ${PHASE2_JUDGE_MODEL_ID}
  profile: ${PHASE2_JUDGE_PROFILE}

safety:
  live_without_gate_max_candidates: 3

providers:
  draft:
    adapter: mock
    base_url_env: PHASE2_MODEL_X_BASE_URL
    api_key_env: PHASE2_MODEL_X_API_KEY
    endpoint_path: /v1/chat/completions
    timeout_seconds: 30
    response_text_path: choices.0.message.content
  judge:
    adapter: mock
    base_url_env: PHASE2_JUDGE_BASE_URL
    api_key_env: PHASE2_JUDGE_API_KEY
    endpoint_path: /v1/chat/completions
    timeout_seconds: 30
    response_text_path: choices.0.message.content
    payload_request_fields:
      - route
      - profile

generation:
  max_new_tokens: 96
  temperature: 0.2
  top_p: 0.95

prompts:
  model_x_draft:
    system: |
      You draft one concise, natural operator request from Redfish REST API evidence.
      Cover all sampled APIs and do not add unsupported work.
    template: |
      Sampled REST API records:
      {records_json}

      Return only the human request text.
  model_x_empty_set_draft:
    system: |
      Draft one concise, natural infrastructure-operator request that cannot be
      fulfilled by any of the candidate Redfish APIs shown. Do not mention the
      candidate APIs and do not turn the request into nonsense.
    template: |
      Candidate Redfish API records:
      {records_json}

      Return only one human request whose covered API set is empty.
  pro_judge:
    system: |
      You judge whether a draft operator request maps back to the exact sampled REST API set.
      API order is irrelevant. Reject missing APIs, extra APIs, ambiguity, repeated intent,
      unnatural or nonsensical text, and method semantics unsupported by allowed_methods.
    template: |
      Sampled REST API records:
      {records_json}

      Draft operator request:
      {draft_text}

      Return JSON with exactly accepted, natural, nonsense, ambiguous,
      duplicate_intent, extra_intents, method_semantics_valid, covered_api_set,
      and reason.
  pro_judge_empty_set:
    system: |
      You judge whether a draft operator request is natural and maps to none of
      the candidate Redfish APIs. Reject any request covered by a candidate API,
      as well as ambiguity, repeated intent, unnatural text, or nonsense.
    template: |
      Candidate Redfish API records:
      {records_json}

      Draft operator request:
      {draft_text}

      Return JSON with exactly accepted, natural, nonsense, ambiguous,
      duplicate_intent, extra_intents, method_semantics_valid, covered_api_set,
      and reason. covered_api_set must be [] for acceptance.

wandb:
  namespace: phase2_labelled_requests
  metric_keys:
    - phase2_labelled_requests/draft_total
    - phase2_labelled_requests/accepted_total
    - phase2_labelled_requests/rejected_total
    - phase2_labelled_requests/nonsense_rate
    - phase2_labelled_requests/invalid_json_rate
    - phase2_labelled_requests/pro_accept_rate
    - phase2_labelled_requests/rest_api_set_match_rate
    - phase2_labelled_requests/natural_command_rate
    - phase2_labelled_requests/ambiguous_rate
    - phase2_labelled_requests/duplicate_intent_rate
    - phase2_labelled_requests/extra_intent_rate
    - phase2_labelled_requests/method_semantics_valid_rate
    - phase2_labelled_requests/empty_set_match_rate
    - phase2_labelled_requests/empty_set_expected_total
    - phase2_labelled_requests/sample_width/k
    - phase2_labelled_requests/vendor/source_corpus
    - phase2_labelled_requests/prompt_spec_version
    - phase2_labelled_requests/model_x/artifact_sha
    - phase2_labelled_requests/judge/model
    - phase2_labelled_requests/judge/profile

acceptance:
  min_pro_accept_rate: 0.9
  min_rest_api_set_match_rate: 0.98
  min_empty_set_accepted_rows: 100
  max_nonsense_rate: 0.01
  max_invalid_json_rate: 0.01

judge_calibration:
  min_precision: 0.99
  min_recall: 0.90
  max_false_accept_rate: 0.01
