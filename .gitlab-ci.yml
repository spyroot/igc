# Internal GitLab CI for the mirrored igc repo.
#
# Surfaces (enforced by scripts/gates/ci_surface_guard.py + configs/ci/pass_matrix.yaml):
#   cpu — every job below; runs on the in-cluster `homelab-k8s` runner. The
#         home-lab cluster has NO GPU and cpu jobs must never request one.
#   gpu — NOTHING here executes on GPUs. GPU passes run on approved GB300 slot
#         containers outside CI; this pipeline only VALIDATES their recorded
#         evidence manifests (reports/gpu-evidence/*.json). The `gb300` tag has
#         no registered runner in home-lab, so a mis-tagged job cannot schedule.
#
# This file carries no internal hostnames: the mirror pulls from GitHub, and
# runners are addressed by tag only.

stages:
  - cpu-gate
  - gpu-evidence

default:
  image:
    # Supplied by private CI from the Builder shared image inventory.
    name: "$TORCH_ML_TOOLBOX_IMAGE"
    pull_policy: always
  tags: [homelab-k8s]
  before_script:
    - export HOMELAB_IN_CLUSTER=1

workflow:
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $MERGE_PROFILE == "merge"'
    - if: '$CI_SERVER_HOST != "gitlab.com" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($MERGE_PROFILE == null || $MERGE_PROFILE == "")'
      variables:
        FOCUSED_GATE: unit.all
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

.focused-dispatch-suppression: &focused-dispatch-suppression
  if: '$CI_SERVER_HOST != "gitlab.com" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FOCUSED_GATE != null && $FOCUSED_GATE != ""'
  when: never

.cpu-base: &cpu-base
  tags: [homelab-k8s]
  variables:
    IGC_SURFACE: cpu
  rules:
    - *focused-dispatch-suppression
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_SERVER_HOST != "gitlab.com" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $MERGE_PROFILE == "merge"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

.igc-gate-before-script: &igc-gate-before-script
  - export HOMELAB_IN_CLUSTER=1
  - conda env create --file environment-ci.yaml

.igc-test-before-script: &igc-test-before-script
  - export HOMELAB_IN_CLUSTER=1
  - conda env create --file environment-dev.yaml
  - conda install --name igc-dev --yes 'setuptools=81.*'
  - conda run -n igc-dev python -c 'import setuptools; print(setuptools.__version__, setuptools.__file__)'
  - conda run -n igc-dev python -c 'import pkg_resources; print(pkg_resources.__file__)'

focused-gate:
  stage: cpu-gate
  variables:
    IGC_SURFACE: cpu
    FOCUSED_GATE: unit.all
  tags: [homelab-k8s]
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $FOCUSED_GATE != null && $FOCUSED_GATE != ""'
    - when: never
  script:
    - ./scripts/check.sh --profile merge --gate "${FOCUSED_GATE:-unit.all}"
  artifacts:
    when: always
    paths:
      - reports/gates/unit.all.json

lint:
  <<: *cpu-base
  stage: cpu-gate
  before_script: *igc-gate-before-script
  script:
    - conda run -n igc-ci-gates ruff check igc tests

offline-gate:
  <<: *cpu-base
  stage: cpu-gate
  before_script: *igc-test-before-script
  variables:
    IGC_SURFACE: cpu
    KMP_DUPLICATE_LIB_OK: "TRUE"
    OMP_NUM_THREADS: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_DATASETS_OFFLINE: "1"
    PIP_CACHE_DIR: .pip-cache
  cache:
    key: conda-pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache
  script:
    - conda run -n igc-dev python -m pytest -q

surface-guard:
  <<: *cpu-base
  stage: cpu-gate
  before_script: *igc-gate-before-script
  script:
    - conda run -n igc-ci-gates python scripts/gates/ci_surface_guard.py

# Outbound fence: no agent artifacts tracked, no agent attribution or
# agent-file chatter in commit/MR messages, no internal endpoint literals.
agent-leak-guard:
  <<: *cpu-base
  stage: cpu-gate
  before_script: *igc-gate-before-script
  variables:
    IGC_SURFACE: cpu
    GIT_DEPTH: "0"
  script:
    - |
      RANGE=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD"
      fi
      printf '%s\n\n%s\n' "${CI_MERGE_REQUEST_TITLE:-}" "${CI_MERGE_REQUEST_DESCRIPTION:-}" > /tmp/mr_message.txt
      conda run -n igc-ci-gates python scripts/gates/agent_leak_guard.py ${RANGE:+--commit-range "$RANGE"} \
        --message-file /tmp/mr_message.txt \
        --branch "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"

# Validates committed GPU evidence manifests (schema in the pass matrix). This
# is a CPU job: it reads JSON, it does not touch a GPU. Malformed evidence
# fails; absent evidence passes (requiredness is enforced at phase acceptance).
gpu-evidence-validate:
  <<: *cpu-base
  stage: gpu-evidence
  before_script: *igc-gate-before-script
  script:
    - conda run -n igc-ci-gates python scripts/gates/ci_surface_guard.py

# Placeholder marking the GPU execution surface. Never runs in home-lab (the
# gb300 tag has no runner there) and never in an MR pipeline; if a GB300 runner
# is ever registered, this stays manual-only per validate->plan->apply->verify.
gb300-surface:
  stage: gpu-evidence
  tags: [gb300]
  variables:
    IGC_SURFACE: gpu
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "GPU passes run on approved GB300 slot containers; see configs/ci/pass_matrix.yaml"
